name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm audit --audit-level high

      - run: pnpm build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prune Next.js internal artifacts
        run: |
          find out -name '__next.*' -delete

      - name: Sync immutable assets to S3 (_next/ is hashed)
        run: |
          # Open pages can still request chunks from the preceding release.
          aws s3 sync out/_next/ s3://${{ secrets.AWS_S3_BUCKET }}/_next/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync search assets while retaining previous hashed indexes
        run: |
          aws s3 sync out/pagefind/ s3://${{ secrets.AWS_S3_BUCKET }}/pagefind/ \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Sync remaining files with short cache
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "_next/*" \
            --exclude "pagefind/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Fix content-type for LLM text exports (Markdown and llms.txt)
        run: |
          # s3 sync guesses types from extensions; .md can land as binary/octet-stream and
          # text/plain without a charset garbles Korean, so set both explicitly.
          find out -type f -name '*.md' | while read -r f; do
            aws s3 cp "$f" "s3://${{ secrets.AWS_S3_BUCKET }}/${f#out/}" \
              --content-type "text/markdown; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate" \
              --metadata-directive REPLACE
          done
          for f in out/llms.txt out/llms-full.txt; do
            aws s3 cp "$f" "s3://${{ secrets.AWS_S3_BUCKET }}/${f#out/}" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate" \
              --metadata-directive REPLACE
          done

      - name: Fix content-type for extensionless image responses
        run: |
          find out -type f \( -name 'opengraph-image' -o -name 'apple-icon' -o -name 'icon' \) | while read -r f; do
            key="${f#out/}"
            aws s3 cp "$f" "s3://${{ secrets.AWS_S3_BUCKET }}/$key" \
              --content-type "image/png" \
              --cache-control "public, max-age=0, must-revalidate" \
              --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  views-worker:
    # The view counter only counts slugs in its build-time allowlist, so a new post needs a
    # Worker deploy too. Runs after the site deploy, only when posts or the Worker changed.
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect post or Worker changes
        id: changes
        run: |
          before="${{ github.event.before }}"
          # Manual runs, first pushes, and force-pushes lack a usable base: deploy to be safe.
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(content/|views-worker/|src/lib/supported-locales\.json$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn when Cloudflare credentials are missing
        if: steps.changes.outputs.changed == 'true' && env.CF_CONFIGURED != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping the views Worker deploy. New posts will not show view counts until the Worker is deployed."

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.changed == 'true' && env.CF_CONFIGURED == 'true'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.changed == 'true' && env.CF_CONFIGURED == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            views-worker/pnpm-lock.yaml

      # The allowlist generator reads post frontmatter with the root's gray-matter.
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true' && env.CF_CONFIGURED == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir views-worker install --frozen-lockfile --ignore-scripts

      - name: Deploy views Worker
        if: steps.changes.outputs.changed == 'true' && env.CF_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --dir views-worker allowlist:check
          pnpm --dir views-worker exec wrangler deploy
